openapi: 3.0.3
info:
  description: |-
    API do sistema de gestão de almoxarifado de obras do Grupo A2G.

    **Autenticação:** chame `POST /api/auth/login`; a resposta define o cookie HttpOnly `sessao`,
    enviado automaticamente nas próximas requisições. A sessão expira após 8 h sem uso.

    **Formatos:** quantidades e valores são strings decimais (`"18.5"`), datas usam `aaaa-mm-dd`.
    Erros sempre vêm como `{"erro": "..."}`; erros de validação (422) trazem também `campos`.
  title: API Almoxarifado A2G
  version: 1.0.0
servers:
- url: http://localhost:3000
paths:
  /api/admin/painel:
    get:
      description: Somente administrador.
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PainelAdminRow'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: Forbidden
      security:
      - sessao: []
      summary: Visão geral dos empreendimentos em andamento
      tags:
      - Administração
  /api/admin/perdas-anormais:
    get:
      description: Somente administrador.
      parameters:
      - in: query
        name: pagina
        schema:
          default: 1
          minimum: 1
          type: integer
      - in: query
        name: por_pagina
        schema:
          default: 50
          maximum: 200
          minimum: 1
          type: integer
      - in: query
        name: empreendimento_id
        schema:
          format: int64
          type: integer
      - in: query
        name: data_inicio
        schema:
          format: date
          type: string
      - in: query
        name: data_fim
        schema:
          format: date
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaPerdasAnormais'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: Forbidden
      security:
      - sessao: []
      summary: Perdas e ajustes de inventário fora da tolerância
      tags:
      - Administração
  /api/auth/login:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginReq'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoResp'
          description: OK
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroValidacao'
          description: Unprocessable Entity
      summary: Entra no sistema e recebe o cookie de sessão
      tags:
      - Autenticação
  /api/auth/logout:
    post:
      description: Requer login.
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
