    RedefinirSenhaReq:
      properties:
        senha:
          description: Nova senha provisória
          maxLength: 72
          minLength: 8
          type: string
      required:
      - senha
      type: object
    SaidaReq:
      properties:
        data:
          $ref: '#/components/schemas/Date'
        destino:
          description: Serviço ou local de destino
          example: Alvenaria – Bloco B
          type: string
        item_id:
          format: int64
          type: integer
        observacoes:
          nullable: true
          type: string
        quantidade:
          example: "18.5"
          type: string
        retirado_por:
          description: Quem retirou; pode não ser usuário do sistema
          example: Zé (pedreiro)
          type: string
      required:
      - item_id
      - quantidade
      - destino
      - retirado_por
      type: object
    SaldoConsolidadoItemRow:
      properties:
        empreendimento:
          type: string
        empreendimento_id:
          format: int64
          type: integer
        quantidade:
          example: "18.5"
          type: string
      type: object
    SaldoConsolidadoResp:
      properties:
        item:
          $ref: '#/components/schemas/Item'
        saldos:
          items:
            $ref: '#/components/schemas/SaldoConsolidadoItemRow'
          nullable: true
          type: array
      type: object
    Saude:
      properties:
        status:
          example: ok
          type: string
      type: object
    SessaoResp:
      properties:
        empreendimentos:
          items:
            $ref: '#/components/schemas/ListEmpreendimentosDoUsuarioRow'
          nullable: true
          type: array
        usuario:
          $ref: '#/components/schemas/Usuario'
      type: object
    Usuario:
      properties:
        ativo:
          type: boolean
        atualizado_em:
          format: date-time
          type: string
        criado_em:
          format: date-time
          type: string
        email:
          type: string
        id:
          format: int64
          type: integer
        nome:
          type: string
        perfil:
          type: string
        telefone:
          nullable: true
          type: string
        trocar_senha:
          type: boolean
      type: object
    UsuarioReq:
      properties:
        email:
          example: joao@a2g.com.br
          format: email
          type: string
        nome:
          example: João da Silva
          type: string
        perfil:
          enum:
          - admin
          - obra
          type: string
        telefone:
          example: (73) 99999-0000
          nullable: true
          type: string
      required:
      - nome
      - email
      - perfil
      type: object
  securitySchemes:
    sessao:
      description: Cookie HttpOnly definido pelo login
      in: cookie
      name: sessao
      type: apiKey
